<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenRoad — 实拍车源与价格对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f9fb;
  --surface:#ffffff;
  --ink:#111317;
  --muted:#5f6672;
  --line:#e5e8ee;
  --cobalt:#1d4ed8;
  --orange:#ea580c;
  --orange-soft:#fff4ed;
  --green:#15803d;
  --green-soft:#ecfdf3;
  --radius:14px;
  --shadow:0 1px 3px rgba(17,19,23,.05), 0 8px 24px rgba(17,19,23,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cobalt);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}

.shell{max-width:1200px;margin:0 auto;padding:0 20px 64px}

/* Top bar */
header{
  position:sticky;top:0;z-index:30;
  background:rgba(248,249,251,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.head-inner{
  max-width:1200px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--orange)}
.brand-sub{font-size:12px;font-weight:500;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.head-actions{display:flex;align-items:center;gap:10px}
.lang-btn{
  border:1px solid var(--line);background:var(--surface);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
}
.lang-btn:hover{border-color:#c7ceda}

/* Hero + Controls */
.hero{padding:28px 0 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hero h1{margin:0;font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;line-height:1.18}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.save-banner{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--orange-soft);color:var(--orange);
  border:1px solid #fed7aa;border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;
}

.controls{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:20px;
}
.controls input{
  flex:1 1 240px;min-width:180px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;font-size:14px;outline:none;
}
.controls input:focus,.controls select:focus{border-color:var(--cobalt)}
.controls select{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;cursor:pointer;
}
.count-pill{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
  color:var(--muted);background:var(--surface);border:1px solid var(--line);
  padding:9px 12px;border-radius:10px;
}

/* Car Grid */
.car-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:18px;
}
.car-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;text-align:left;padding:0;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.car-card:hover{transform:translateY(-2px);border-color:#c5ccd8;box-shadow:0 12px 28px rgba(17,19,23,.08)}
.car-photo-wrap{position:relative;aspect-ratio:4/3;background:#eceff4;overflow:hidden}
.car-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.photo-badge{
  position:absolute;right:10px;bottom:10px;
  background:rgba(17,19,23,.76);color:#fff;
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;
  backdrop-filter:blur(4px);
}
.save-badge{
  position:absolute;left:10px;top:10px;
  background:var(--orange);color:#fff;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
}
.car-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.car-title{margin:0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.car-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.meta-chip{background:#f1f4f8;padding:3px 8px;border-radius:6px;font-weight:500}

.price-box{
  margin-top:auto;padding-top:12px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;
}
.price-col-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.price-market{
  font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;
  color:#858d99;text-decoration:line-through;
}
.price-ours{
  font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;
  color:var(--orange);line-height:1.1;
}

.empty-state{
  grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
}

/* Detail Modal */
.modal-backdrop{
  position:fixed;inset:0;z-index:50;
  background:rgba(17,19,23,.62);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-backdrop.open{display:flex}
.modal{
  background:var(--surface);border-radius:18px;width:100%;max-width:980px;
  max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);
  display:grid;grid-template-columns:1.25fr 1fr;
}
@media (max-width:820px){
  .modal{grid-template-columns:1fr;max-height:94vh}
}
.gallery-pane{background:#111317;padding:16px;display:flex;flex-direction:column;gap:10px}
.gallery-main{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#1b1f26}
.gallery-main img{width:100%;height:100%;object-fit:contain;background:#111317;display:block}
.gal-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(17,19,23,.7);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.gal-nav:hover{background:rgba(17,19,23,.92)}
.gal-prev{left:10px}
.gal-next{right:10px}
.gal-counter{
  position:absolute;right:10px;bottom:10px;
  background:rgba(17,19,23,.75);color:#fff;font-size:12px;
  font-family:'JetBrains Mono',monospace;padding:3px 9px;border-radius:999px;
}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.thumb{
  aspect-ratio:4/3;border-radius:7px;overflow:hidden;padding:0;
  border:2px solid transparent;background:#22262e;cursor:pointer;opacity:.7;
}
.thumb.active{border-color:var(--orange);opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.info-pane{padding:22px 24px;display:flex;flex-direction:column;gap:16px;position:relative}
.modal-close{
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.modal-close:hover{background:#f1f4f8}
.info-title{margin:0;padding-right:36px;font-size:21px;line-height:1.28;letter-spacing:-.02em}
.spec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.spec-item{background:#f6f7fa;border-radius:10px;padding:10px 12px}
.spec-label{font-size:11px;color:var(--muted)}
.spec-val{font-size:14px;font-weight:600;margin-top:2px}

.compare-card{
  border:1px solid #fed7aa;background:var(--orange-soft);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;
}
.compare-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.compare-label{font-size:13px;color:var(--muted)}
.compare-market{font-family:'JetBrains Mono',monospace;font-size:16px;color:#7a8290;text-decoration:line-through}
.compare-ours{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--orange)}
.compare-save{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--green-soft);color:var(--green);border:1px solid #bbf7d0;
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;
}

.safety-strip{
  border-top:1px solid var(--line);padding-top:14px;
  display:flex;flex-direction:column;gap:8px;
}
.safety-title{font-size:12px;font-weight:600;color:var(--muted)}
.safety-pills{display:flex;flex-wrap:wrap;gap:8px}
.safety-pill{
  font-size:12px;font-weight:500;background:#f1f4f8;color:var(--ink);
  padding:5px 10px;border-radius:999px;
}

/* Optional VIN Quick Lookup (compact, collapsible) */
.vin-section{
  margin-top:36px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 20px;
}
.vin-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.vin-head h2{margin:0;font-size:16px}
.vin-head span{font-size:12px;color:var(--muted)}
.vin-form{display:flex;flex-wrap:wrap;gap:10px}
.vin-form input{
  flex:1 1 260px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  font-family:'JetBrains Mono',monospace;font-size:14px;text-transform:uppercase;
}
.vin-form button{
  background:var(--ink);color:#fff;border:none;border-radius:10px;
  padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
}
.vin-form button:disabled{opacity:.5;cursor:not-allowed}
.vin-result{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:none}
.vin-result.show{display:block}
.vin-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.vin-err{color:#b91c1c;font-size:13px;margin-top:10px}

footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>OpenRoad</span>
      <span class="brand-sub" data-t="brandsub">实拍车源 · 透明比价</span>
    </div>
    <div class="head-actions">
      <button type="button" class="lang-btn" id="lang-btn">EN</button>
    </div>
  </div>
</header>

<main class="shell">
  <section class="hero">
    <div>
      <h1 data-t="herotitle">精选 12 台实拍车源</h1>
      <p data-t="herosub">每台车均已对应实拍组图，直接对比市场参考价与我们的直购价。</p>
    </div>
    <div class="save-banner" data-t="savebanner">每台比市场参考价直降 $3,000</div>
  </section>

  <section class="controls" aria-label="Filter cars">
    <input id="car-search" type="search" placeholder="搜索车型、品牌或驱动方式…">
    <select id="car-make" aria-label="Filter by make">
      <option value="">全部品牌</option>
    </select>
    <select id="car-year" aria-label="Filter by year">
      <option value="">全部年份</option>
    </select>
    <span class="count-pill" id="car-count">12 / 12</span>
  </section>

  <section class="car-grid" id="car-grid" aria-live="polite"></section>

  <section class="vin-section">
    <div class="vin-head">
      <h2 data-t="vintitle">按 VIN 快速查价</h2>
      <span data-t="vinsub">输入任意 17 位 VIN，查看车辆参数、市场参考价与我们的价格（比市场价低 $3,000）</span>
    </div>
    <form class="vin-form" id="vin-form">
      <input id="vin-input" maxlength="17" placeholder="输入 17 位 VIN，例如 5UXTY3C05M9E85547" autocomplete="off">
      <button type="submit" id="vin-submit" data-t="vinbtn">查询</button>
    </form>
    <div class="vin-err" id="vin-err"></div>
    <div class="vin-result" id="vin-result"></div>
  </section>

  <footer data-t="footer">
    注：车源实拍图来自 4.15 批次本地车源；“市场参考价”为同款市场对比参考，“我们的价格”按比市场价低 $3,000 展示。安全提示为 NHTSA 同款同年份公开统计，仅作参考。
  </footer>
</main>

<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="gallery-pane">
      <div class="gallery-main">
        <img id="gal-main-img" src="" alt="">
        <button type="button" class="gal-nav gal-prev" id="gal-prev" aria-label="Previous photo">&#8249;</button>
        <button type="button" class="gal-nav gal-next" id="gal-next" aria-label="Next photo">&#8250;</button>
        <span class="gal-counter" id="gal-counter">1 / 6</span>
      </div>
      <div class="thumbs" id="gal-thumbs"></div>
    </div>
    <div class="info-pane">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 class="info-title" id="modal-title"></h2>
      <div class="spec-grid" id="modal-specs"></div>
      <div class="compare-card" id="modal-price"></div>
      <div class="safety-strip" id="modal-safety"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let lang = localStorage.getItem('openroad-v2-lang') || 'zh';
let carsData = null;
let currentCar = null;
let currentPhotoIdx = 0;

const T = {
  zh: {
    brandsub: '实拍车源 · 透明比价',
    herotitle: '精选 12 台实拍车源',
    herosub: '每台车均已对应实拍组图，直接对比市场参考价与我们的直购价。',
    savebanner: '每台比市场参考价直降 $3,000',
    searchPh: '搜索车型、品牌或驱动方式…',
    allMakes: '全部品牌',
    allYears: '全部年份',
    photosBadge: n => `${n} 张实拍`,
    saveTag: n => `直降 $${n.toLocaleString()}`,
    marketLabel: '市场对比价',
    ourLabel: '我们的价格',
    saveBannerCard: n => `比市场价低 $${n.toLocaleString()}`,
    year: '年份',
    make: '品牌',
    drive: '驱动',
    mileage: '里程',
    safetyTitle: 'NHTSA 同款安全概览（简洁参考）',
    safetyLoading: '正在查询 NHTSA 公开记录…',
    recalls: n => `车型召回：${n} 项`,
    complaints: n => `车型投诉：${n} 条`,
    safetyNA: 'NHTSA 统计暂不可用',
    empty: '没有符合条件的车辆。',
    vintitle: '按 VIN 快速查价',
    vinsub: '输入任意 17 位 VIN，查看车辆参数、市场参考价与我们的价格（比市场价低 $3,000）',
    vinPh: '输入 17 位 VIN，例如 5UXTY3C05M9E85547',
    vinbtn: '查询',
    vinLoading: '查询中…',
    vinBad: '请输入有效的 17 位 VIN（不含 I、O、Q）。',
    vinNoPrice: '暂无足够市场挂牌价',
    footer: '注：车源实拍图来自 4.15 批次本地车源；“市场参考价”为同款市场对比参考，“我们的价格”按比市场价低 $3,000 展示。安全提示为 NHTSA 同款同年份公开统计，仅作参考。',
    langBtn: 'EN',
  },
  en: {
    brandsub: 'Real Photos · Clear Pricing',
    herotitle: '12 Featured Vehicles',
    herosub: 'Real photo sets matched to each car, with side-by-side market price and our price.',
    savebanner: '$3,000 below market reference on every car',
    searchPh: 'Search model, make, or drivetrain…',
    allMakes: 'All makes',
    allYears: 'All years',
    photosBadge: n => `${n} photos`,
    saveTag: n => `-$${n.toLocaleString()}`,
    marketLabel: 'Market Price',
    ourLabel: 'Our Price',
    saveBannerCard: n => `You save $${n.toLocaleString()} vs. market`,
    year: 'Year',
    make: 'Make',
    drive: 'Drivetrain',
    mileage: 'Mileage',
    safetyTitle: 'NHTSA Model Safety Summary',
    safetyLoading: 'Checking NHTSA public records…',
    recalls: n => `Model recalls: ${n}`,
    complaints: n => `Model complaints: ${n}`,
    safetyNA: 'NHTSA summary unavailable',
    empty: 'No vehicles match your filter.',
    vintitle: 'Quick VIN Price Check',
    vinsub: 'Paste any 17-character VIN to see vehicle specs, market price, and our price ($3,000 below market)',
    vinPh: 'Enter 17-char VIN, e.g. 5UXTY3C05M9E85547',
    vinbtn: 'Lookup',
    vinLoading: 'Checking…',
    vinBad: 'Enter a valid 17-character VIN (no I, O, or Q).',
    vinNoPrice: 'Insufficient market listings',
    footer: 'Note: Photos are from the 4.15 local vehicle batch. Market price is shown for comparison; our price is $3,000 below market reference. Safety counts are model-level NHTSA statistics.',
    langBtn: '中文',
  }
};

const tr = k => T[lang][k];
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtUSD = n => n != null ? '$' + Number(n).toLocaleString('en-US') : '—';
const fmtMi = n => n != null ? Number(n).toLocaleString('en-US') + ' mi' : '—';

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.dataset.t;
    if (T[lang][key]) el.textContent = T[lang][key];
  });
  $('lang-btn').textContent = tr('langBtn');
  $('car-search').placeholder = tr('searchPh');
  $('vin-input').placeholder = tr('vinPh');
  const mkSel = $('car-make');
  const yrSel = $('car-year');
  if (mkSel.options.length) mkSel.options[0].textContent = tr('allMakes');
  if (yrSel.options.length) yrSel.options[0].textContent = tr('allYears');
  renderCars();
  if (currentCar) renderModalInfo(currentCar);
}

async function loadCars() {
  try {
    const r = await fetch('/api/cars');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    carsData = await r.json();
    const mkSel = $('car-make');
    const yrSel = $('car-year');
    mkSel.innerHTML = `<option value="">${esc(tr('allMakes'))}</option>` +
      carsData.makes.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    yrSel.innerHTML = `<option value="">${esc(tr('allYears'))}</option>` +
      carsData.years.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
    renderCars();
  } catch (e) {
    $('car-grid').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
  }
}

function renderCars() {
  if (!carsData) return;
  const q = $('car-search').value.trim().toLowerCase();
  const mk = $('car-make').value.toLowerCase();
  const yr = $('car-year').value;
  const filtered = carsData.items.filter(c =>
    (!mk || c.make.toLowerCase() === mk) &&
    (!yr || String(c.year) === yr) &&
    (!q || c.title.toLowerCase().includes(q) || c.make.toLowerCase().includes(q) || (c.drive || '').toLowerCase().includes(q))
  );
  $('car-count').textContent = `${filtered.length} / ${carsData.total}`;
  const grid = $('car-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">${esc(tr('empty'))}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(c => `
    <button type="button" class="car-card" data-car-id="${esc(c.id)}">
      <div class="car-photo-wrap">
        <img src="${esc(c.cover)}" alt="${esc(c.title)}" loading="lazy">
        <span class="save-badge">${esc(tr('saveTag')(c.savings || 3000))}</span>
        <span class="photo-badge">${esc(tr('photosBadge')(c.photos.length))}</span>
      </div>
      <div class="car-body">
        <h3 class="car-title">${esc(c.title)}</h3>
        <div class="car-meta">
          <span class="meta-chip">${esc(c.year)}</span>
          ${c.drive ? `<span class="meta-chip">${esc(c.drive)}</span>` : ''}
          ${c.mileage ? `<span class="meta-chip">${esc(fmtMi(c.mileage))}</span>` : ''}
        </div>
        <div class="price-box">
          <div>
            <div class="price-col-label">${esc(tr('marketLabel'))}</div>
            <div class="price-market">${esc(fmtUSD(c.market_price))}</div>
          </div>
          <div>
            <div class="price-col-label">${esc(tr('ourLabel'))}</div>
            <div class="price-ours">${esc(fmtUSD(c.our_price))}</div>
          </div>
        </div>
      </div>
    </button>
  `).join('');

  grid.querySelectorAll('[data-car-id]').forEach(btn => {
    btn.onclick = () => {
      const car = carsData.items.find(x => x.id === btn.dataset.carId);
      if (car) openModal(car);
    };
  });
}

function renderGallery() {
  if (!currentCar) return;
  const photos = currentCar.photos || [];
  const src = photos[currentPhotoIdx] || currentCar.cover;
  $('gal-main-img').src = src;
  $('gal-main-img').alt = currentCar.title;
  $('gal-counter').textContent = `${currentPhotoIdx + 1} / ${photos.length}`;
  $('gal-thumbs').innerHTML = photos.map((p, idx) => `
    <button type="button" class="thumb${idx === currentPhotoIdx ? ' active' : ''}" data-idx="${idx}">
      <img src="${esc(p)}" alt="">
    </button>
  `).join('');
  $('gal-thumbs').querySelectorAll('[data-idx]').forEach(t => {
    t.onclick = () => { currentPhotoIdx = Number(t.dataset.idx); renderGallery(); };
  });
}

function renderModalInfo(car) {
  $('modal-title').textContent = car.title;
  $('modal-specs').innerHTML = `
    <div class="spec-item"><div class="spec-label">${esc(tr('year'))}</div><div class="spec-val">${esc(car.year)}</div></div>
    <div class="spec-item"><div class="spec-label">${esc(tr('make'))}</div><div class="spec-val">${esc(car.make)}</div></div>
    <div class="spec-item"><div class="spec-label">${esc(tr('drive'))}</div><div class="spec-val">${esc(car.drive || '—')}</div></div>
    <div class="spec-item"><div class="spec-label">${esc(tr('mileage'))}</div><div class="spec-val">${esc(fmtMi(car.mileage))}</div></div>
  `;
  $('modal-price').innerHTML = `
    <div class="compare-row">
      <span class="compare-label">${esc(tr('marketLabel'))}</span>
      <span class="compare-market">${esc(fmtUSD(car.market_price))}</span>
    </div>
    <div class="compare-row">
      <span class="compare-label">${esc(tr('ourLabel'))}</span>
      <span class="compare-ours">${esc(fmtUSD(car.our_price))}</span>
    </div>
    <div class="compare-save">${esc(tr('saveBannerCard')(car.savings || 3000))}</div>
  `;
  renderSafety(car.safety);
}

function renderSafety(safety) {
  const el = $('modal-safety');
  if (safety === undefined) {
    el.innerHTML = `<div class="safety-title">${esc(tr('safetyTitle'))}</div><div class="safety-pills"><span class="safety-pill">${esc(tr('safetyLoading'))}</span></div>`;
    return;
  }
  if (!safety || (safety.recalls_count == null && safety.complaints_count == null)) {
    el.innerHTML = `<div class="safety-title">${esc(tr('safetyTitle'))}</div><div class="safety-pills"><span class="safety-pill">${esc(tr('safetyNA'))}</span></div>`;
    return;
  }
  const pills = [];
  if (safety.recalls_count != null) {
    const label = esc(tr('recalls')(safety.recalls_count));
    pills.push(safety.recalls_source
      ? `<a class="safety-pill" href="${esc(safety.recalls_source)}" target="_blank" rel="noopener">${label}</a>`
      : `<span class="safety-pill">${label}</span>`);
  }
  if (safety.complaints_count != null) {
    const label = esc(tr('complaints')(safety.complaints_count));
    pills.push(safety.complaints_source
      ? `<a class="safety-pill" href="${esc(safety.complaints_source)}" target="_blank" rel="noopener">${label}</a>`
      : `<span class="safety-pill">${label}</span>`);
  }
  el.innerHTML = `<div class="safety-title">${esc(tr('safetyTitle'))}</div><div class="safety-pills">${pills.join('')}</div>`;
}

async function openModal(car) {
  currentCar = { ...car };
  currentPhotoIdx = 0;
  renderGallery();
  renderModalInfo(currentCar);
  $('modal-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  try {
    const r = await fetch(`/api/cars/${encodeURIComponent(car.id)}`);
    if (r.ok && currentCar && currentCar.id === car.id) {
      const full = await r.json();
      currentCar.safety = full.safety || null;
      renderSafety(currentCar.safety);
    }
  } catch (_) {
    if (currentCar && currentCar.id === car.id) renderSafety(null);
  }
}

function closeModal() {
  $('modal-backdrop').classList.remove('open');
  document.body.style.overflow = '';
  currentCar = null;
}

$('modal-close').onclick = closeModal;
$('modal-backdrop').onclick = e => { if (e.target === $('modal-backdrop')) closeModal(); };
$('gal-prev').onclick = () => {
  if (!currentCar) return;
  const n = currentCar.photos.length;
  currentPhotoIdx = (currentPhotoIdx - 1 + n) % n;
  renderGallery();
};
$('gal-next').onclick = () => {
  if (!currentCar) return;
  const n = currentCar.photos.length;
  currentPhotoIdx = (currentPhotoIdx + 1) % n;
  renderGallery();
};
document.addEventListener('keydown', e => {
  if (!currentCar) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') $('gal-prev').click();
  if (e.key === 'ArrowRight') $('gal-next').click();
});

$('car-search').oninput = renderCars;
$('car-make').onchange = renderCars;
$('car-year').onchange = renderCars;
$('lang-btn').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('openroad-v2-lang', lang);
  applyLang();
};

$('vin-form').onsubmit = async e => {
  e.preventDefault();
  const vin = $('vin-input').value.trim().toUpperCase();
  const errEl = $('vin-err');
  const resEl = $('vin-result');
  errEl.textContent = '';
  resEl.classList.remove('show');
  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) {
    errEl.textContent = tr('vinBad');
    return;
  }
  const btn = $('vin-submit');
  btn.disabled = true;
  btn.textContent = tr('vinLoading');
  try {
    const r = await fetch(`/api/report/${encodeURIComponent(vin)}?lang=${lang}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Error');
    const v = data.vehicle?.data || {};
    const title = [v.ModelYear, v.Make, v.Model, v.Trim].filter(Boolean).join(' ') || vin;
    const val = data.value || {};
    let marketStr = tr('vinNoPrice');
    let ourStr = '—';
    if (val.retail) {
      marketStr = fmtUSD(val.retail);
      ourStr = fmtUSD(val.our_price ?? Math.max(0, val.retail - 3000));
    } else if (Array.isArray(val.retail_range) && val.retail_range.length === 2) {
      marketStr = `${fmtUSD(val.retail_range[0])} – ${fmtUSD(val.retail_range[1])}`;
      const o = val.our_price_range || [Math.max(0, val.retail_range[0] - 3000), Math.max(0, val.retail_range[1] - 3000)];
      ourStr = `${fmtUSD(o[0])} – ${fmtUSD(o[1])}`;
    }
    const rc = data.recalls?.status === 'ok' ? data.recalls.count : '—';
    const cc = data.complaints?.status === 'ok' ? data.complaints.count : '—';
    resEl.innerHTML = `
      <div style="font-weight:700;font-size:16px">${esc(title)} <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);font-weight:500">${esc(vin)}</span></div>
      <div class="vin-result-grid">
        <div class="spec-item"><div class="spec-label">${esc(tr('marketLabel'))}</div><div class="spec-val">${esc(marketStr)}</div></div>
        <div class="spec-item" style="background:var(--orange-soft)"><div class="spec-label">${esc(tr('ourLabel'))} (-$3,000)</div><div class="spec-val" style="color:var(--orange)">${esc(ourStr)}</div></div>
        <div class="spec-item"><div class="spec-label">${esc(tr('safetyTitle'))}</div><div class="spec-val">${esc(tr('recalls')(rc))} · ${esc(tr('complaints')(cc))}</div></div>
      </div>
    `;
    resEl.classList.add('show');
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = tr('vinbtn');
  }
};

applyLang();
loadCars();
</script>
</body>
</html>
